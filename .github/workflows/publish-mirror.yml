name: Publish mirror to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - publish.py
      - .github/workflows/publish-mirror.yml
  # Расписание: зеркало не должно отставать от живого сайта.
  # 03:00 UTC = 06:00 МСК.
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build mirror from source site
        run: python3 publish.py

      - name: Publish to gh-pages branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan gh-pages
          git rm -rf --cached . >/dev/null 2>&1 || true
          rm -rf .github publish.py README.md
          cp -a _site/. .
          rm -rf _site
          touch .nojekyll
          git add -A
          git commit -m "Mirror of salon-ai-blog.spru.site"
          git push --force https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git gh-pages
