name: Publish mirror to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - publish.py
      - .github/workflows/publish-mirror.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build mirror from source site
        run: python3 publish.py

      - name: Publish to gh-pages branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan gh-pages
          git rm -rf --cached . >/dev/null 2>&1 || true
          rm -rf .github publish.py README.md
          cp -a _site/. .
          rm -rf _site
          touch .nojekyll
          if [ -f index.html ]; then
            sed -i 's|<meta name="yandex-verification" content="[0-9a-f]*">|<meta name="yandex-verification" content="3924572dfd6f1636">|' index.html
          fi
          cat > yandex_3924572dfd6f1636.html <<'HTML'
<html>
    <head>
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    </head>
    <body>Verification: 3924572dfd6f1636</body>
</html>
HTML
          git add -A
          git commit -m "Mirror of salon-ai-blog.spru.site"
          git push --force https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git gh-pages
